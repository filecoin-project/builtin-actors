version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # A dependency joins the first group it matches, so the named families come first.
    groups:
      rustcrypto:
        patterns:
          - "k256"
          - "p256"
          - "ecdsa"
          - "elliptic-curve"
          - "sha2"
          - "sha3"
          - "digest"
          - "signature"
          - "crypto-bigint"
      fvm:
        patterns:
          - "fvm_*"
          - "frc42_*"
          - "frc46_*"
          - "fvm_actor_utils"
      patch-versions:
        update-types:
          - "patch"
      minor-versions:
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
