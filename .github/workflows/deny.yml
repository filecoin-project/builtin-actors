# This workflow will run `cargo-deny`, checking for dependency issues related to licensing, known vulnerabilities, and more.
# The configuration file is in [deny.toml](../../deny.toml).
name: Cargo Deny
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
      with:
        arguments: --workspace --all-features
